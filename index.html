<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Space Kite</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: url("k.png") center/cover no-repeat;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.45);
      color: #fff;
      text-align: center;
    }
    #overlay .card {
      background: rgba(0,0,0,.55);
      padding: 16px 22px;
      border-radius: 12px;
      min-width: 280px;
    }
    #overlay h1 {
      margin: 0 0 8px 0;
      font-size: 42px;
    }
    #overlay .score { font-size: 22px; margin: 4px 0 10px; font-weight: 700; }
    #overlay .hint { font-size: 16px; opacity: .9; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div class="card">
      <h1>Game Over</h1>
      <div class="score" id="finalScore">Score: 0 — Best: 0</div>
      <div class="hint">Tap / Click / Press Space to restart</div>
    </div>
  </div>

  <script>
    // ---------- Canvas / Setup ----------
    const cvs = document.getElementById("game");
    const ctx = cvs.getContext("2d");
    const overlay = document.getElementById("overlay");
    const finalScoreEl = document.getElementById("finalScore");
    const world = { w: 0, h: 0 };

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      cvs.width = Math.floor(window.innerWidth * dpr);
      cvs.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      world.w = window.innerWidth;
      world.h = window.innerHeight;

      player.w = Math.floor(world.w * 0.095);
      player.h = player.w;
      player.x = Math.floor(world.w * 0.12);
      player.y = Math.floor(world.h * 0.5 - player.h / 2);
      speeds.player = Math.max(4, Math.floor(world.w * 0.009));
    }
    window.addEventListener("resize", resize);

    // ---------- Settings ----------
    const HIT_PAD = 10;
    const speeds = { player: 8, spawnMS: 500, meteorMin: 4, meteorMax: 10 };
    let difficultyBoost = 0;

    // ---------- Images ----------
    const playerImg = new Image();
    playerImg.src = "p.png";
    let playerReady = false;
    playerImg.onload = () => (playerReady = true);

    const meteorImg = new Image();
    meteorImg.src = "s.png";
    let meteorReady = false;
    meteorImg.onload = () => (meteorReady = true);

    const player = { x: 0, y: 0, w: 80, h: 80 };

    const meteors = [];
    const explosions = [];

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

    // ---------- Spawn Meteors ----------
    function spawnMeteor() {
      const size = rand(world.w * 0.06, world.w * 0.12);
      const x = rand(0, world.w - size);
      const y = -size - 20;
      const vy = rand(speeds.meteorMin, speeds.meteorMax) + difficultyBoost;
      const vx = rand(-3, 3); // diagonal drift
      meteors.push({
        x, y, vx, vy, w: size, h: size,
        angle: rand(0, Math.PI * 2),
        spin: rand(-0.08, 0.08)
      });
    }

    // ---------- State ----------
    let running = true;
    let score = 0;
    let best = Number(localStorage.getItem("spacekite.best") || 0);
    let lastSpawn = 0;
    let lastTime = 0;

    // ---------- Input ----------
    const keys = new Set();
    window.addEventListener("keydown", e => {
      if (e.code === "Space" && !running) return reset();
      keys.add(e.code);
    });
    window.addEventListener("keyup", e => keys.delete(e.code));

    let dragging = false;
    cvs.addEventListener("pointerdown", e => { if (!running) return reset(); dragging = true; moveTo(e); });
    cvs.addEventListener("pointermove", e => { if (dragging) moveTo(e); });
    cvs.addEventListener("pointerup", () => dragging = false);
    cvs.addEventListener("pointercancel", () => dragging = false);

    function moveTo(e) {
      const r = cvs.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      player.x = clamp(x - player.w / 2, 0, world.w - player.w);
      player.y = clamp(y - player.h / 2, 0, world.h - player.h);
    }

    // ---------- Collisions ----------
    function hitbox(o) {
      return { x: o.x + HIT_PAD, y: o.y + HIT_PAD, w: o.w - HIT_PAD*2, h: o.h - HIT_PAD*2 };
    }
    function aabbOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ---------- Explosion ----------
    function explode(x, y) {
      for (let i = 0; i < 30; i++) {
        explosions.push({
          x, y,
          vx: rand(-4, 4),
          vy: rand(-4, 4),
          r: rand(2, 6),
          life: rand(30, 70),
          color: `hsl(${rand(0,60)},100%,${rand(50,70)}%)`
        });
      }
    }

    function updateExplosions() {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const p = explosions[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) explosions.splice(i, 1);
      }
    }

    function drawExplosions() {
      for (const p of explosions) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---------- Update ----------
    function update(dt, t) {
      if (!running) return;

      const step = speeds.player;
      if (keys.has("ArrowLeft") || keys.has("KeyA"))  player.x -= step;
      if (keys.has("ArrowRight")|| keys.has("KeyD"))  player.x += step;
      if (keys.has("ArrowUp")   || keys.has("KeyW"))  player.y -= step;
      if (keys.has("ArrowDown") || keys.has("KeyS"))  player.y += step;
      player.x = clamp(player.x, 0, world.w - player.w);
      player.y = clamp(player.y, 0, world.h - player.h);

      // Aggressive difficulty ramp
      if (t - lastSpawn > speeds.spawnMS) {
        lastSpawn = t;
        spawnMeteor();
        difficultyBoost = Math.min(10, difficultyBoost + 0.08);
        speeds.spawnMS = Math.max(220, speeds.spawnMS - 4);
      }

      for (const m of meteors) {
        m.x += m.vx;
        m.y += m.vy;
        m.angle += m.spin * 1.5;

        // pulsate size slightly
        const pulse = 1 + Math.sin(t / 200 + m.x) * 0.01;
        m.w *= pulse;
        m.h = m.w;
      }

      for (let i = meteors.length - 1; i >= 0; i--) {
        if (meteors[i].y - meteors[i].h > world.h + 60) meteors.splice(i, 1);
      }

      const hb = hitbox(player);
      for (const m of meteors) {
        const mRect = { x: m.x, y: m.y, w: m.w, h: m.h };
        if (aabbOverlap(hb, mRect)) {
          explode(player.x + player.w / 2, player.y + player.h / 2);
          running = false;
          best = Math.max(best, score);
          localStorage.setItem("spacekite.best", String(best));
          showOverlay();
          break;
        }
      }

      updateExplosions();
      score += Math.max(1, Math.floor(dt / 16));
    }

    // ---------- Draw ----------
    function draw() {
      ctx.clearRect(0, 0, world.w, world.h);

      // Meteors
      for (const m of meteors) {
        ctx.save();
        ctx.translate(m.x + m.w / 2, m.y + m.h / 2);
        ctx.rotate(m.angle);
        if (meteorReady) {
          ctx.drawImage(meteorImg, -m.w / 2, -m.h / 2, m.w, m.h);
        } else {
          ctx.fillStyle = "rgba(255, 180, 60, 0.85)";
          ctx.beginPath();
          ctx.arc(0, 0, Math.min(m.w, m.h) / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Player
      if (playerReady) {
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
      } else {
        ctx.fillStyle = "rgba(255,0,128,0.6)";
        ctx.fillRect(player.x, player.y, player.w, player.h);
      }

      // Explosions
      drawExplosions();

      // HUD
      ctx.fillStyle = "#000";
      ctx.font = "28px Arial Black";
      ctx.fillText("Score: " + score, 20, 30);
      ctx.fillText("Best: " + best, 20, 65);
    }

    // ---------- Overlay / Reset ----------
    function showOverlay() {
      finalScoreEl.textContent = `Score: ${score} — Best: ${best}`;
      overlay.style.display = "grid";
    }
    function hideOverlay() { overlay.style.display = "none"; }
    function reset() {
      meteors.length = 0;
      explosions.length = 0;
      score = 0;
      running = true;
      difficultyBoost = 0;
      speeds.spawnMS = 500;
      player.x = Math.floor(world.w * 0.12);
      player.y = Math.floor(world.h * 0.5 - player.h / 2);
      hideOverlay();
    }

    overlay.addEventListener("click", reset);
    cvs.addEventListener("click", () => { if (!running) reset(); });
    window.addEventListener("keydown", e => { if (e.code === "Space" && !running) reset(); });

    // ---------- Loop ----------
    function loop(ts) {
      const dt = lastTime ? ts - lastTime : 16;
      lastTime = ts;
      update(dt, ts);
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
