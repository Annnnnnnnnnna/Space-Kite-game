<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Space Kite: Energy Rush</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: url("k.png") center/cover no-repeat;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.45);
      color: #fff;
      text-align: center;
    }
    #overlay .card {
      background: rgba(0,0,0,.55);
      padding: 16px 22px;
      border-radius: 12px;
      min-width: 280px;
    }
    #overlay h1 { margin: 0 0 8px 0; font-size: 42px; letter-spacing: .3px; }
    #overlay .score { font-size: 22px; margin: 6px 0 10px; font-weight: 700; }
    #overlay .hint  { font-size: 16px; opacity: .9; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div class="card">
      <h1>Game Over</h1>
      <div class="score" id="finalScore">Score: 0 — Best: 0</div>
      <div class="hint">Tap / Click / Press Space to restart</div>
    </div>
  </div>

  <script>
    // ---------- Canvas ----------
    const cvs = document.getElementById("game");
    const ctx = cvs.getContext("2d");
    const overlay = document.getElementById("overlay");
    const finalScoreEl = document.getElementById("finalScore");
    const world = { w: 0, h: 0 };

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      cvs.width  = Math.floor(window.innerWidth  * dpr);
      cvs.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      world.w = window.innerWidth;
      world.h = window.innerHeight;
      player.w = Math.floor(world.w * 0.09);
      player.h = player.w;
      player.x = Math.floor(world.w * 0.12);
      player.y = Math.floor(world.h * 0.5 - player.h / 2);
      speeds.player = Math.max(4, Math.floor(world.w * 0.009));
    }
    window.addEventListener("resize", resize);

    // ---------- Settings ----------
    const HIT_PAD = 10;
    const speeds  = { player: 8, spawnMS: 500, bonusMS: 3000, minSpawnMS: 260 };
    let difficultyBoost = 0;

    // ---------- Images ----------
    const playerImg = new Image(); playerImg.src = "p.png";
    let playerReady = false; playerImg.onload = () => playerReady = true;

    const sphereSrcs = ["t.png", "s.png", "h.png", "u.png"];
    const sphereImgs = sphereSrcs.map(src => {
      const im = new Image(); im.src = src; im.ready = false;
      im.onload = () => im.ready = true;
      return im;
    });

    const bonusImg = new Image(); bonusImg.src = "r.png";
    let bonusReady = false; bonusImg.onload = () => bonusReady = true;

    // ---------- Entities ----------
    const player = { x: 0, y: 0, w: 80, h: 80 };
    const spheres = [];
    const bonuses = [];
    const explosions = [];

    let started = false;
    let running = true;
    let score = 0;
    let best = Number(localStorage.getItem("spacekite.best") || 0);
    let lastSpawn = 0;
    let lastBonusSpawn = 0;
    let lastTime = 0;

    // ---------- Helpers ----------
    const rand = (a,b) => Math.random()*(b-a)+a;
    const clamp = (v,a,b) => v<a?a:v>b?b:v;
    const aabb = (A,B) => A.x<B.x+B.w && A.x+A.w>B.x && A.y<B.y+B.h && A.y+A.h>B.y;
    const hitbox = o => ({x:o.x+HIT_PAD,y:o.y+HIT_PAD,w:o.w-HIT_PAD*2,h:o.h-HIT_PAD*2});

    // ---------- Spawn ----------
    function spawnSphere() {
      const size = rand(world.w*0.05, world.w*0.09); // smaller spheres
      const x = rand(0, world.w - size);
      const y = -size - 20;
      const vy = rand(4.5, 9.5) + difficultyBoost;
      const vx = rand(-3,3);
      const img = sphereImgs[(Math.random()*sphereImgs.length)|0];
      spheres.push({x,y,w:size,h:size,vx,vy,angle:rand(0,Math.PI*2),spin:rand(-0.08,0.08),img});
    }

    function spawnBonus() {
      const size = Math.max(36, Math.floor(world.w * 0.06));
      const x = rand(0, world.w - size);
      const y = -size - 20;
      const vy = rand(2.5, 4.0);
      bonuses.push({x,y,w:size,h:size,vy,angle:rand(0,Math.PI*2),spin:rand(-0.05,0.05)});
    }

    // ---------- Input ----------
    const keys = new Set();
    window.addEventListener("keydown", e => {
      if (e.code==="Space" && !running) return reset();
      keys.add(e.code);
      started = true;
    });
    window.addEventListener("keyup", e => keys.delete(e.code));

    let dragging = false;
    cvs.addEventListener("pointerdown", e => { if(!running) return reset(); dragging=true; moveTo(e); started=true; });
    cvs.addEventListener("pointermove", e => { if(dragging) moveTo(e); });
    cvs.addEventListener("pointerup", ()=>dragging=false);

    function moveTo(e){
      const r=cvs.getBoundingClientRect();
      const x=e.clientX-r.left;
      const y=e.clientY-r.top;
      player.x=clamp(x-player.w/2,0,world.w-player.w);
      player.y=clamp(y-player.h/2,0,world.h-player.h);
    }

    // ---------- Explosion Effect ----------
    function explode(x,y,color="hsl(200,100%,70%)") {
      for(let i=0;i<30;i++){
        explosions.push({x,y,vx:rand(-4,4),vy:rand(-4,4),r:rand(2,6),life:rand(30,70),color});
      }
    }
    function updateExplosions(){
      for(let i=explosions.length-1;i>=0;i--){
        const p=explosions[i];
        p.x+=p.vx; p.y+=p.vy; p.life--;
        if(p.life<=0) explosions.splice(i,1);
      }
    }
    function drawExplosions(){
      for(const p of explosions){
        ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
    }

    // ---------- Update ----------
    function update(dt,t){
      if(!running) return;
      const step=speeds.player;
      if(keys.has("ArrowLeft")||keys.has("KeyA")) player.x-=step;
      if(keys.has("ArrowRight")||keys.has("KeyD")) player.x+=step;
      if(keys.has("ArrowUp")||keys.has("KeyW")) player.y-=step;
      if(keys.has("ArrowDown")||keys.has("KeyS")) player.y+=step;
      player.x=clamp(player.x,0,world.w-player.w);
      player.y=clamp(player.y,0,world.h-player.h);

      if(t-lastSpawn>speeds.spawnMS){
        lastSpawn=t;
        spawnSphere();
        difficultyBoost=Math.min(10,difficultyBoost+0.08);
        speeds.spawnMS=Math.max(speeds.minSpawnMS,speeds.spawnMS-4);
      }

      if(t-lastBonusSpawn>speeds.bonusMS){
        lastBonusSpawn=t;
        if(Math.random()<0.6) spawnBonus();
        speeds.bonusMS=Math.max(1600,speeds.bonusMS-40);
      }

      for(const s of spheres){s.x+=s.vx; s.y+=s.vy; s.angle+=s.spin*1.2;}
      for(const b of bonuses){b.y+=b.vy; b.angle+=b.spin;}
      for(let i=spheres.length-1;i>=0;i--) if(spheres[i].y>world.h+60) spheres.splice(i,1);
      for(let i=bonuses.length-1;i>=0;i--) if(bonuses[i].y>world.h+60) bonuses.splice(i,1);

      const hb=hitbox(player);

      for(const s of spheres){
        if(aabb(hb,s)){
          running=false;
          best=Math.max(best,score);
          localStorage.setItem("spacekite.best",String(best));
          showOverlay();
          break;
        }
      }

      // Bonus effect — DESTROYS all meteors
      for(let i=bonuses.length-1;i>=0;i--){
        const b=bonuses[i];
        if(aabb(hb,b)){
          score+=100;
          bonuses.splice(i,1);
          explode(player.x+player.w/2,player.y+player.h/2,"hsl(60,100%,70%)");
          for(const s of spheres) explode(s.x+s.w/2,s.y+s.h/2,"hsl(0,100%,60%)");
          spheres.length=0; // clear all meteors
        }
      }

      updateExplosions();
      score+=Math.max(1,Math.floor(dt/16));
    }

    // ---------- Draw ----------
    function draw(){
      ctx.clearRect(0,0,world.w,world.h);

      for(const s of spheres){
        const pulse=1+Math.sin(performance.now()/220+s.x*0.02)*0.02;
        const w=s.w*pulse,h=s.h*pulse;
        ctx.save();
        ctx.translate(s.x+s.w/2,s.y+s.h/2);
        ctx.rotate(s.angle);
        if(s.img && s.img.ready) ctx.drawImage(s.img,-w/2,-h/2,w,h);
        else {ctx.fillStyle="rgba(0,200,255,0.4)"; ctx.beginPath(); ctx.arc(0,0,Math.min(w,h)/2,0,Math.PI*2); ctx.fill();}
        ctx.restore();
      }

      for(const b of bonuses){
        const w=b.w,h=b.h;
        ctx.save(); ctx.translate(b.x+b.w/2,b.y+b.h/2); ctx.rotate(b.angle);
        if(bonusReady) ctx.drawImage(bonusImg,-w/2,-h/2,w,h);
        else {ctx.fillStyle="gold"; ctx.beginPath(); ctx.arc(0,0,Math.min(w,h)/2,0,Math.PI*2); ctx.fill();}
        ctx.restore();
      }

      // Player glow
      const cx=player.x+player.w/2,cy=player.y+player.h/2;
      const glow=ctx.createRadialGradient(cx,cy,player.w*0.25,cx,cy,player.w*1.0);
      glow.addColorStop(0,"rgba(0,255,255,0.45)");
      glow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,player.w,0,Math.PI*2); ctx.fill();

      if(playerReady) ctx.drawImage(playerImg,player.x,player.y,player.w,player.h);
      else {ctx.fillStyle="rgba(255,0,128,0.6)"; ctx.fillRect(player.x,player.y,player.w,player.h);}

      drawExplosions();

      ctx.fillStyle="#000";
      ctx.font="28px Arial Black";
      ctx.fillText("Score: "+score,20,20);
      ctx.fillText("Best: "+best,20,56);
    }

    // ---------- Overlay / Reset ----------
    function showOverlay(){
      finalScoreEl.textContent=`Score: ${score} — Best: ${best}`;
      overlay.style.display="grid";
    }
    function hideOverlay(){overlay.style.display="none";}
    function reset(){
      spheres.length=0; bonuses.length=0; explosions.length=0;
      score=0; running=true; difficultyBoost=0;
      speeds.spawnMS=500; speeds.bonusMS=3000;
      player.x=Math.floor(world.w*0.12);
      player.y=Math.floor(world.h*0.5-player.h/2);
      hideOverlay();
    }

    overlay.addEventListener("click",reset);
    cvs.addEventListener("click",()=>{if(!running)reset();});
    window.addEventListener("keydown",e=>{if(e.code==="Space"&&!running)reset();});

    function loop(ts){
      const dt=lastTime?(ts-lastTime):16;
      lastTime=ts;
      update(dt,ts);
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
